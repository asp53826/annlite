name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "59 6 * * 3"
    - cron: "47 7 1 * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '47 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -r requirements-dev.txt && make PYTHON=python
      test-command: >-
        python -m pytest tests -q
      verification-command: >-
        python -c "import sys; sys.path.insert(0, 'python'); import _annlite; print(_annlite.simd_backend())"

  documentation-scribe:
    if: github.event_name != 'pull_request_target' && github.event.schedule != '47 7 1 * *'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 1 * *'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/benchmark-keeper.yml@v1.0.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install -r requirements-dev.txt && make PYTHON=python
      preflight-command: >-
        python -m pytest tests -q
      benchmark-command: >-
        ./scripts/fetch_data.sh && python bench/benchmark.py --dataset sift --ef 16,32,64,128

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.0.0

